version: 2

updates:
  # Backend — picks up both requirements.txt and requirements-dev.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # Wait a few days after a release before bumping — dodges a freshly
    # published compromised version. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(backend)"
    groups:
      # One PR per week for routine bumps; security fixes still open on their own.
      backend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend)"
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images are pinned to exact patch tags in the Dockerfiles; these
  # entries keep those pins from going stale.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(backend)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
