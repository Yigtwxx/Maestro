name: Dependabot

# Turns the weekly Dependabot batch into a self-merging one. Two jobs, both
# gated on the PR *author* being dependabot[bot] (github.actor is spoofable by
# a re-run; the author is not) and on this exact repository, so a fork never
# auto-merges anything.
#
#   relock     pip PRs only. Dependabot rewrites backend/requirements*.txt in
#              its own style, so the CI "Lock freshness check" fails on every
#              one of them (see scripts/relock.sh for the three kinds of
#              drift). This job runs that same script and pushes the result.
#              The push uses RELOCK_TOKEN, a fine-grained PAT stored as a
#              *Dependabot* secret (a Dependabot-triggered run sees no other
#              secrets), because a push made with GITHUB_TOKEN does not start
#              workflow runs and would leave the PR permanently unchecked.
#              The commit message carries "[dependabot skip]": Dependabot stops
#              rebasing a PR once someone else has pushed to it, and that
#              marker is the documented opt-out. Without it a pip PR that fell
#              behind main would never be rebased, and the ruleset requires an
#              up-to-date branch before merging.
#
#   automerge  Every Dependabot PR. Enables GitHub's native auto-merge, which
#              merges only once every required check is green and the branch
#              is up to date — CI stays the gate, this just removes the click.
#              Patch and minor bumps qualify; major bumps stay manual, and base
#              image (docker) bumps are patch-only because a minor there is a
#              new interpreter or runtime line.
#
# Plain pull_request, never pull_request_target: nothing here needs the base
# context, and the token the relock job pushes with is scoped to one repo's
# contents only.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  relock:
    name: Relock backend requirements
    if: >-
      github.repository == 'Yigtwxx/Maestro' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/pip/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch, not the merge ref: the result is pushed back to it.
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # A bare `pip install uv` on purpose — the same as the CI gate, so the
      # two always resolve with the same uv release.
      - name: Regenerate locks
        run: |
          pip install uv
          ./scripts/relock.sh

      - name: Commit and push
        env:
          RELOCK_TOKEN: ${{ secrets.RELOCK_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- backend/requirements.txt backend/requirements-dev.txt; then
            echo "Locks already fresh; nothing to push."
            exit 0
          fi
          if [ -z "$RELOCK_TOKEN" ]; then
            echo "::error::RELOCK_TOKEN is not set. Add a fine-grained PAT (Contents: read and write on this repo) under Settings > Secrets and variables > Dependabot, or run scripts/relock.sh locally on this branch."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.txt backend/requirements-dev.txt
          git commit -q \
            -m "chore(backend): regenerate locks with the documented uv commands [dependabot skip]" \
            -m "Dependabot rewrites the locks without uv's environment markers and extras handling, so the CI freshness gate reports drift. Regenerated by the Dependabot workflow with scripts/relock.sh."
          # Credential helper rather than a token in the URL: git never echoes
          # helper output, so the token cannot land in a log line.
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${RELOCK_TOKEN}"; }; f' \
            push origin "HEAD:refs/heads/${HEAD_REF}"

  automerge:
    name: Enable auto-merge
    if: >-
      github.repository == 'Yigtwxx/Maestro' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.package-ecosystem != 'docker')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"

      - name: Left for a human
        if: >-
          !(steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
             steps.metadata.outputs.package-ecosystem != 'docker'))
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          echo "Not auto-merging (update-type=${UPDATE_TYPE}, ecosystem=${ECOSYSTEM}). Review and merge by hand."
