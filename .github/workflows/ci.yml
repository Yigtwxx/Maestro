name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review lets the draft-gated docker job run once a PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Coverage is reported (term-missing in the log) but NOT gated on a
      # threshold: a legitimate change must never fail CI on a coverage dip.
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      # Fails when requirements*.txt were not regenerated after a
      # requirements*.in edit (e.g. a Dependabot PR that only bumped the .in
      # ranges). Without --upgrade uv keeps existing pins, so this checks
      # .in/.txt sync, not "is a newer release out" — deterministic, not flaky.
      - name: Lock freshness check
        run: |
          pip install uv
          # --python-version 3.11 pins the resolution floor: without it uv
          # resolves for the interpreter running the compile, and a 3.12+ host
          # produces pins (e.g. numpy) that cannot install on the 3.11 image.
          uv pip compile requirements.in -o requirements.txt --universal --python-version 3.11 --generate-hashes --custom-compile-command "uv pip compile requirements.in -o requirements.txt --universal --python-version 3.11 --generate-hashes"
          uv pip compile requirements-dev.in -o requirements-dev.txt --universal --python-version 3.11 --generate-hashes -c requirements.txt --custom-compile-command "uv pip compile requirements-dev.in -o requirements-dev.txt --universal --python-version 3.11 --generate-hashes -c requirements.txt"
          git diff --exit-code -- requirements.txt requirements-dev.txt

  # The test suite builds its schema with Base.metadata.create_all on in-memory
  # SQLite, so it never executes a migration: a model column added without an
  # Alembic revision passes every other gate and first fails in production, at
  # `alembic upgrade head`, after the deploy approval. This job is the only
  # place the two are compared. `alembic check` autogenerates against the
  # migrated database and fails when it finds any operation still outstanding.
  migrations:
    name: Backend (migrations match models)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major as production (docker-compose.prod.yml). Migrations use
        # PostgreSQL-specific types, so SQLite is not a substitute here.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro_migcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql+asyncpg://maestro:maestro@localhost:5432/maestro_migcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Applies the whole chain from an empty database, which also proves the
      # revision graph is linear and every down_revision resolves.
      - name: Apply migrations from scratch
        run: alembic upgrade head

      - name: Schema matches models
        run: alembic check

      # The 0019 backfill is a one-shot, irreversible data migration: it reads
      # whatever rows already exist and decides, in Python, which ones collide
      # under the new canonical rule. Its only production run is the first
      # real one -- every other gate in this workflow, including "Apply
      # migrations from scratch" above, runs the whole chain against an empty
      # `users` table, so the read loop returns zero rows and the write loop's
      # chunking, its single `unique_canonicals` call, and the NULL-on-
      # collision behaviour have never executed against real data. This step
      # downgrades one revision, seeds a colliding pair plus a non-colliding
      # row, re-runs the migration, and asserts the documented outcome so a
      # regression here fails CI instead of surfacing on the first real
      # deploy.
      - name: Backfill grandfathers colliding accounts
        env:
          PGPASSWORD: maestro
        run: |
          set -euo pipefail

          alembic downgrade 0018_free_plan

          # `you@gmail.com` and `y.o.u+tag@gmail.com` reduce to the same
          # canonical address and must be grandfathered as NULL rather than
          # merged or arbitrarily assigned to one of them. `alice+work@gmail.com`
          # collides with nothing and must backfill normally.
          psql -v ON_ERROR_STOP=1 -h localhost -U maestro -d maestro_migcheck <<'SQL'
          INSERT INTO users (
            id, email, hashed_password, created_at, updated_at,
            default_reviewer_enabled, totp_enabled, email_verified, role,
            default_tracing_enabled
          ) VALUES
            (gen_random_uuid(), 'you@gmail.com', 'placeholder', now(), now(), false, false, false, 'user', false),
            (gen_random_uuid(), 'y.o.u+tag@gmail.com', 'placeholder', now(), now(), false, false, false, 'user', false),
            (gen_random_uuid(), 'alice+work@gmail.com', 'placeholder', now(), now(), false, false, false, 'user', false);
          SQL

          alembic upgrade head

          you_canonical=$(psql -v ON_ERROR_STOP=1 -h localhost -U maestro -d maestro_migcheck -tAc \
            "SELECT canonical_email FROM users WHERE email = 'you@gmail.com'")
          tag_canonical=$(psql -v ON_ERROR_STOP=1 -h localhost -U maestro -d maestro_migcheck -tAc \
            "SELECT canonical_email FROM users WHERE email = 'y.o.u+tag@gmail.com'")
          alice_canonical=$(psql -v ON_ERROR_STOP=1 -h localhost -U maestro -d maestro_migcheck -tAc \
            "SELECT canonical_email FROM users WHERE email = 'alice+work@gmail.com'")

          # psql renders SQL NULL as an empty string with -tA, so a non-empty
          # result here means the collision was NOT grandfathered.
          if [ -n "$you_canonical" ]; then
            echo "expected you@gmail.com to be grandfathered NULL, got '$you_canonical'"
            exit 1
          fi
          if [ -n "$tag_canonical" ]; then
            echo "expected y.o.u+tag@gmail.com to be grandfathered NULL, got '$tag_canonical'"
            exit 1
          fi
          if [ "$alice_canonical" != "alice@gmail.com" ]; then
            echo "expected alice+work@gmail.com to backfill to alice@gmail.com, got '$alice_canonical'"
            exit 1
          fi

          echo "backfill behaved as documented: collisions grandfathered, non-colliding row backfilled"

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (build verify)
    # On main the publish workflow builds and pushes these same images; here we
    # only prove a pull request has not broken either Dockerfile. Skipped on
    # drafts (a draft can't merge anyway) and re-runs when marked ready.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    name: Smoke (stack boots, readiness green)
    # The `docker` job above proves both Dockerfiles still *build*. Nothing
    # proved the backend image still *runs*: 95 backend test files exercise the
    # app under pytest's ASGI transport, where Postgres/Mongo/Qdrant/Redis are
    # fixtures rather than real servers. A broken migration chain, a missing
    # runtime dependency dropped from requirements.txt, or a settings default
    # that only fails at import time all pass every existing gate and surface
    # for the first time on deploy. This job closes that gap.
    #
    # Same draft gate as `docker` — it costs a couple of minutes and a draft
    # cannot merge anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Loaded into the local daemon (rather than only built) so `docker run`
      # below can use it. Shares the `docker` job's cache scope, so this is
      # usually a cache hit rather than a second full build.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: false
          load: true
          tags: maestro-backend:smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Only the four backing services from the dev compose file. The app
      # services live in docker-compose.prod.yml and drag in Ollama (a model
      # pull) and Umami, none of which /health/ready consults.
      - name: Start backing services
        run: docker compose up -d --wait postgres mongo qdrant redis

      # The default `pytest` run replaces Mongo and Qdrant with in-memory
      # doubles, and each double hand-defines the methods it answers to. So when
      # qdrant-client removed `AsyncQdrantClient.search`, the fakes kept
      # replying, every gate stayed green, and `retrieve_memories` — which
      # degrades to [] on any exception — returned "no results" for every user
      # in production. Nothing else in CI can catch that class of drift, because
      # nothing else runs the service code against a real client. These tests
      # do, against the four services already started above.
      #
      # Placed before the image work on purpose: a drift failure is reported in
      # seconds rather than after a build and boot, and it cannot be mistaken
      # for an app-runtime failure.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Ports match the compose file, whose offsets are deliberate (27018, not
      # 27017 — see docker-compose.yml). REQUIRE_INTEGRATION_SERVERS turns the
      # fixtures' "no server, skip" path into a hard failure: a skip here would
      # mean a broken compose service reports a green job that asserted nothing,
      # which is the exact failure mode this tier exists to remove.
      #
      # No --cov: the coverage number comes from the `backend` job, and a second
      # partial report would misrepresent it. `-m integration` deselects
      # everything else at collection, so this is a handful of tests rather than
      # a second full suite. They use a maestro_test_<uuid> database and scratch
      # Qdrant collections, so they cannot disturb the app container started
      # further down against db `maestro`.
      - name: Integration tests (real Mongo + Qdrant)
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27018
          QDRANT_URL: http://localhost:6333
          REQUIRE_INTEGRATION_SERVERS: "1"
        run: pytest -m integration -p no:cacheprovider

      # Ports and credentials mirror .env.example, which points at the same
      # compose file (5433/27018 are deliberate — see the comments there).
      # ENVIRONMENT stays at its non-production default, so the placeholder
      # secrets below are accepted by the _guard_production_secrets validator.
      - name: Write run configuration
        run: |
          cat > .env.smoke <<'EOF'
          ENVIRONMENT=development
          POSTGRES_URL=postgresql+asyncpg://maestro:maestro@localhost:5433/maestro
          MONGODB_URL=mongodb://localhost:27018
          MONGODB_DB_NAME=maestro
          QDRANT_URL=http://localhost:6333
          REDIS_URL=redis://localhost:6379
          WEB_CONCURRENCY=1
          EMAIL_PROVIDER=console
          PAYMENT_PROVIDER=mock
          HEALTH_DETAIL_TOKEN=smoke-detail-token
          METRICS_TOKEN=smoke-metrics-token
          EOF

      # Runs the real migration chain from an empty database — the same check
      # the `migrations` job makes, but through the shipped image rather than a
      # host virtualenv, so a migration that depends on something only present
      # in the dev environment fails here.
      - name: Apply migrations
        run: |
          docker run --rm --network host --env-file .env.smoke \
            maestro-backend:smoke alembic upgrade head

      - name: Start backend
        run: |
          docker run -d --name maestro-backend-smoke --network host \
            --env-file .env.smoke maestro-backend:smoke

      # /health is dependency-free (liveness); /health/ready pings all four
      # services and answers 503 until each one is reachable. Polling the
      # latter is therefore the assertion that the whole stack wired up.
      # The token matches .env.smoke above: without it the response names no
      # service, and the failure dump below would say only "degraded".
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
              -H 'X-Health-Token: smoke-detail-token' \
              http://localhost:8000/health/ready || echo 000)
            if [ "$code" = "200" ]; then
              echo "ready after ${attempt}s"
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend never became ready; last response:"
          cat /tmp/ready.json 2>/dev/null || echo "(no response body)"
          exit 1

      # A readiness probe that reports "ready" while the API router failed to
      # mount would still pass the step above, so assert one real route answers.
      # /billing/plans/public is the anonymous listing — its authenticated
      # sibling /billing/plans would answer 401 here and prove nothing.
      - name: Check the API surface responds
        run: |
          code=$(curl -s -o /tmp/plans.json -w '%{http_code}' \
            http://localhost:8000/api/v1/billing/plans/public)
          if [ "$code" != "200" ]; then
            echo "::error::GET /api/v1/billing/plans/public returned $code"
            cat /tmp/plans.json
            exit 1
          fi

      # pytest drives the app over an ASGI transport, which never runs lifespan
      # events — so a watchdog task that raises at startup, or an exposition
      # body malformed only once the real gauges are populated, passes every
      # other gate and surfaces first on deploy. This is the only place both
      # actually run. The 404 check comes first: an unset METRICS_TOKEN must
      # hide the route, and asserting that here keeps the default honest.
      - name: Check the metrics endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics)
          if [ "$code" != "404" ]; then
            echo "::error::GET /metrics without a token returned $code, expected 404"
            exit 1
          fi
          code=$(curl -s -o /tmp/metrics.txt -w '%{http_code}' \
            -H 'X-Metrics-Token: smoke-metrics-token' http://localhost:8000/metrics)
          if [ "$code" != "200" ]; then
            echo "::error::GET /metrics with the token returned $code"
            cat /tmp/metrics.txt
            exit 1
          fi
          for metric in maestro_build_info maestro_http_requests_total \
                        maestro_http_request_duration_seconds_bucket; do
            grep -q "^${metric}" /tmp/metrics.txt || {
              echo "::error::${metric} missing from the exposition body"
              cat /tmp/metrics.txt
              exit 1
            }
          done

      # Runs even when an earlier step failed — without the container log a
      # failure here is undiagnosable from the job summary alone.
      - name: Dump logs
        if: always()
        run: |
          echo '--- backend ---'
          docker logs maestro-backend-smoke 2>&1 | tail -100 || true
          echo '--- backing services ---'
          docker compose logs --tail=50 postgres mongo qdrant redis || true
