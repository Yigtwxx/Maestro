# =========================================================================
# Maestro Platform — local infrastructure
# Brings up Postgres, MongoDB, Qdrant and Redis for development.
# The FastAPI backend and Next.js frontend run on the host (see README).
# Ollama also runs on the host (`ollama serve`) so it can use the GPU.
#
# Redis is optional locally: leave REDIS_URL unset and the rate limiter keeps
# its buckets in process memory, which is correct for a single dev worker.
#
# Every service carries a `mem_limit`, mirroring docker-compose.prod.yml. Without
# one, each container sizes its caches from the whole WSL2 VM; the four of them
# together starved the Next.js dev server on the host and froze the machine.
# The VM itself is capped separately in %USERPROFILE%\.wslconfig.
# =========================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: maestro-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
      POSTGRES_DB: maestro
    ports:
      # Host port 5433: a native PostgreSQL service on Windows already owns 5432.
      - "5433:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro -d maestro"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: maestro-mongo
    restart: unless-stopped
    mem_limit: 1g
    # WiredTiger sizes its cache from *visible* RAM, which inside WSL2 is the
    # whole VM — it ignores the cgroup limit and would get OOM-killed instead.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    volumes:
      - ./.data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # Pinned to the same tag as production; `latest` silently changed the storage
    # format between runs and mmaps the segment store on start.
    image: qdrant/qdrant:v1.18.2
    container_name: maestro-qdrant
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - ./.data/qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: maestro-redis
    restart: unless-stopped
    mem_limit: 256m
    # Rate-limit buckets expire in 60s, so eviction under pressure costs nothing.
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
