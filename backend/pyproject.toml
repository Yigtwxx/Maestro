[project]
name = "maestro-backend"
version = "0.1.0"
description = "Maestro Platform — AI agent orchestration backend (FastAPI)"
requires-python = ">=3.11"
license = "LicenseRef-SustainableUse-1.0"
authors = [{ name = "Yiğit Erdoğan", email = "yigiterdogan023@gmail.com" }]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
