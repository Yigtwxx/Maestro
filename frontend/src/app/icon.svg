<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The Maestro monogram. The champagne square mirrors BRAND.primary; the
       navy gloss stops and the path mirror MONOGRAM_GRADIENT and MONOGRAM_PATH
       in src/lib/seo/config.ts. A static file rather than a generated one: an
       icon this simple costs nothing to serve and stays crisp at every size. -->
  <defs>
    <linearGradient id="navyGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7cff" />
      <stop offset="50%" stop-color="#3b5bdb" />
      <stop offset="100%" stop-color="#141a3c" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#d3cbc0" />
  <path
    d="M2.8 15.4C3.1 17.7 3.8 19 4.7 19C6 19 6.1 8.6 7.7 6C8.1 5.3 8.7 5.6 9 6.4C9.9 9 10.8 12.4 12 12.4C13.2 12.4 14.1 9 15 6.4C15.3 5.6 15.9 5.3 16.3 6C17.9 8.6 18 19 19.3 19C20.6 19 21.6 15.8 22.9 11.2"
    transform="translate(4 4)"
